    <h2>遊び方</h2>
    <p>スペースを押すと羽ばたきます(上昇)。離すと羽ばたきを止めます(下降)。</p>
    <p>迫りくる壁をすり抜け、⭐️をたくさん取るとスコアが上がりますが、同時に壁穴は狭くなり、難易度が上がります。</p>
    <p>目指せ1000点越え！</p>
    <h2>Tips</h2>
    <p>プレイ中に「D」を押すと、壁の番号と壁穴(Gap)の幅が表示されます。</p>
